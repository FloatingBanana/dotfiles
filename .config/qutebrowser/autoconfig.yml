# If a config.py file exists, this file is ignored unless it's explicitly loaded
# via config.load_autoconfig(). For more information, see:
# https://github.com/qutebrowser/qutebrowser/blob/main/doc/help/configuring.asciidoc#loading-autoconfigyml
# DO NOT edit this file by hand, qutebrowser will overwrite it.
# Instead, create a config.py - see :help for details.

config_version: 2
settings:
  auto_save.session:
    global: true
  bindings.commands:
    global:
      normal: {}
  colors.webpage.darkmode.enabled:
    global: false
  colors.webpage.preferred_color_scheme:
    global: dark
  completion.open_categories:
    global:
    - searchengines
    - quickmarks
    - bookmarks
    - history
    - filesystem
  content.autoplay:
    global: false
  content.blocking.enabled:
    global: true
  content.headers.user_agent:
    https://accounts.google.com/*: Mozilla/5.0 (X11; Linux i686; rv:10.0) Gecko/20100101
      Firefox/10.0
  content.javascript.clipboard:
    https://github.com: access-paste
    https://web.stremio.com: access-paste
  content.mouse_lock:
    https://editor.graphite.art: true
  content.notifications.enabled:
    https://www.youtube.com: false
  content.pdfjs:
    global: true
  downloads.location.suggestion:
    global: both
  downloads.prevent_mixed_content:
    global: false
  editor.command:
    global:
    - foot
    - neovim
    - -f
    - '{file}'
  fileselect.folder.command:
    global:
    - foot
    - ranger
    - --choosedir={}
  fileselect.handler:
    global: external
  fileselect.multiple_files.command:
    global:
    - foot
    - ranger
    - --choosefiles={}
  fileselect.single_file.command:
    global:
    - foot
    - ranger
    - --choosefile={}
  session.lazy_restore:
    global: true
  url.default_page:
    global: https://www.google.com/
  url.searchengines:
    global:
      DEFAULT: https://www.google.com/search?q={}
  url.start_pages:
    global: https://www.google.com
  url.yank_ignored_parameters:
    global:
    - ref
    - utm_source
    - utm_medium
    - utm_campaign
    - utm_term
    - utm_content
    - utm_name
